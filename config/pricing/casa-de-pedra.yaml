# Casa de Pedra, Copacabana — direct-booking pricing rules.
#
# Currency is intentionally USD because the current website and Stripe checkout
# charge in USD. A change to BRL must create a new approved rule-set version;
# amounts in this file must never be converted implicitly at runtime.
#
# Calendar resolver requirements:
#   christian.easter.western
#   br.independence-day
#   br.rj.rio.rock-in-rio
#   br.rj.rio.carnival
#   gregorian.new-year

schema: pmc.price-rules/v1

rule_set:
  id: casa-de-pedra-copacabana-direct
  version: 2
  effective_from: 2026-01-01

listing_context:
  currency: USD
  timezone: America/Sao_Paulo
  jurisdiction:
    country: BR
    subdivision: BR-RJ
    municipality: IBGE:3304557

# Standard price for a three-to-six-night stay outside a matching season/event.
base:
  weekday: "380.00"
  weekend: "420.00"
  weekend_days: [fri, sat]

rules:
  # --------------------------------------------------------------------------
  # Annual seasons. These rules are mutually exclusive.
  # --------------------------------------------------------------------------
  - id: low-season
    name: Late autumn and early winter low season
    layer: season
    group: annual-season
    priority: 100
    stacking: exclusive
    when:
      annually:
        from: "05-15"
        through: "06-30"
    apply:
      adjust_nightly_percent: "-10"

  - id: july-school-holidays
    name: Brazil July school-holiday demand
    layer: season
    group: annual-season
    priority: 110
    stacking: exclusive
    when:
      annually:
        from: "07-01"
        through: "07-31"
    apply:
      adjust_nightly_percent: "10"

  - id: summer-high-season
    name: Rio summer high season
    layer: season
    group: annual-season
    priority: 120
    stacking: exclusive
    when:
      annually:
        from: "12-01"
        through: "03-31"
    apply:
      adjust_nightly_percent: "15"

  # --------------------------------------------------------------------------
  # Recurring holidays and confirmed demand events.
  # Major-event rules are exclusive: the highest-priority matching rule wins.
  # --------------------------------------------------------------------------
  - id: christmas-week
    name: Christmas holiday week
    layer: event
    group: major-event
    priority: 700
    stacking: exclusive
    when:
      annually:
        from: "12-20"
        through: "12-26"
    apply:
      adjust_nightly_percent: "25"
      minimum_stay: 4
    suppresses: [length-of-stay]

  - id: easter-weekend
    name: Western Easter long weekend
    layer: event
    group: major-event
    priority: 750
    stacking: exclusive
    when:
      event:
        key: christian.easter.western
        days_before: 3
        days_after: 0
        accepted_status: [confirmed, calculated]
    apply:
      set_final_nightly: "500.00"
      minimum_stay: 4
    suppresses: [annual-season, length-of-stay]

  - id: brazil-independence-day
    name: Brazil Independence Day
    layer: event
    group: major-event
    priority: 760
    stacking: exclusive
    when:
      event:
        key: br.independence-day
        days_before: 1
        days_after: 0
        accepted_status: [confirmed, calculated]
    apply:
      set_final_nightly: "600.00"
      minimum_stay: 3
    suppresses: [annual-season, length-of-stay]

  - id: rock-in-rio
    name: Rock in Rio confirmed event nights
    layer: event
    group: major-event
    priority: 800
    stacking: exclusive
    when:
      event:
        key: br.rj.rio.rock-in-rio
        days_before: 0
        days_after: 0
        accepted_status: [confirmed]
    apply:
      set_final_nightly: "720.00"
      minimum_stay: 4
    suppresses: [annual-season, length-of-stay]

  - id: rio-carnival
    name: Rio Carnival
    layer: event
    group: major-event
    priority: 900
    stacking: exclusive
    when:
      event:
        key: br.rj.rio.carnival
        days_before: 2
        days_after: 1
        accepted_status: [confirmed, calculated]
    apply:
      set_final_nightly: "820.00"
      minimum_stay: 6
    suppresses: [annual-season, length-of-stay]

  - id: rio-carnival-prime
    name: Rio Carnival prime weekend nights
    layer: event
    group: major-event
    priority: 910
    stacking: exclusive
    when:
      all:
        - event:
            key: br.rj.rio.carnival
            days_before: 2
            days_after: 1
            accepted_status: [confirmed, calculated]
        - weekday: [fri, sat, sun]
    apply:
      set_final_nightly: "950.00"
      minimum_stay: 6
    suppresses: [annual-season, length-of-stay]

  - id: copacabana-new-year
    name: Copacabana New Year event window
    layer: event
    group: major-event
    priority: 950
    stacking: exclusive
    when:
      event:
        key: gregorian.new-year
        days_before: 4
        days_after: 1
        accepted_status: [confirmed, calculated]
    apply:
      set_final_nightly: "920.00"
      minimum_stay: 6
    suppresses: [annual-season, length-of-stay]

  - id: copacabana-new-year-tail
    name: Copacabana New Year departure shoulder
    layer: event
    group: major-event
    priority: 955
    stacking: exclusive
    when:
      all:
        - event:
            key: gregorian.new-year
            days_before: 4
            days_after: 1
            accepted_status: [confirmed, calculated]
        - annually:
            from: "01-02"
            through: "01-02"
    apply:
      set_final_nightly: "800.00"
      minimum_stay: 6
    suppresses: [annual-season, length-of-stay]

  - id: copacabana-new-year-prime
    name: Copacabana New Year's Eve and New Year's Day
    layer: event
    group: major-event
    priority: 960
    stacking: exclusive
    when:
      all:
        - event:
            key: gregorian.new-year
            days_before: 4
            days_after: 1
            accepted_status: [confirmed, calculated]
        - annually:
            from: "12-31"
            through: "01-01"
    apply:
      set_final_nightly: "1000.00"
      minimum_stay: 6
    suppresses: [annual-season, length-of-stay]

  # --------------------------------------------------------------------------
  # Length-of-stay pricing. Three-to-six-night stays receive the base/event
  # result unchanged. These brackets are mutually exclusive.
  # --------------------------------------------------------------------------
  - id: one-night-premium
    name: One-night stay premium
    layer: stay
    group: length-of-stay
    priority: 200
    stacking: exclusive
    when:
      stay_nights:
        exactly: 1
    apply:
      adjust_nightly_percent: "50"

  - id: two-night-premium
    name: Two-night stay premium
    layer: stay
    group: length-of-stay
    priority: 190
    stacking: exclusive
    when:
      stay_nights:
        exactly: 2
    apply:
      adjust_nightly_percent: "25"

  - id: weekly-stay
    name: Seven to thirteen nights
    layer: stay
    group: length-of-stay
    priority: 100
    stacking: exclusive
    when:
      stay_nights:
        at_least: 7
        fewer_than: 14
    apply:
      stay_discount_percent: "7"

  - id: two-week-stay
    name: Fourteen to twenty-seven nights
    layer: stay
    group: length-of-stay
    priority: 110
    stacking: exclusive
    when:
      stay_nights:
        at_least: 14
        fewer_than: 28
    apply:
      stay_discount_percent: "12"

  - id: monthly-stay
    name: Twenty-eight nights or more
    layer: stay
    group: length-of-stay
    priority: 120
    stacking: exclusive
    when:
      stay_nights:
        at_least: 28
    apply:
      stay_discount_percent: "18"

guardrails:
  hard_floor: "300.00"
  hard_ceiling: "1250.00"
  maximum_automatic_change_percent: "50"
  rounding:
    method: nearest
    increment: "5.00"
